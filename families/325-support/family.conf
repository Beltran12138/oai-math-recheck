# openai/math result family 325, fifth comparator file:
# ComparatorChallenges/HilbertCrouzeix.lean, which lean/docs/325.md labels
# "Numerical-range geometry and finite-compression support".  Four supporting
# theorems, one of them the trivial zero-space case -- support, not the
# headline.  Rebuilt for completeness so that all five files of the family are.

FAMILY_DIR=OAI/Analysis/HilbertCrouzeix
CHALLENGE=ComparatorChallenges/HilbertCrouzeix.lean
MAIN_IMPORT=OAI.Analysis.HilbertCrouzeix.Main
DOCS_NUMBER=325

THEOREMS="OAI.HilbertCrouzeix.numericalClosure_geometry
  OAI.HilbertCrouzeix.exists_finite_compression
  OAI.HilbertCrouzeix.rational_denominator_isUnit
  OAI.HilbertCrouzeix.zeroConclusion"

CHALLENGE_MODULE=ComparatorChallenges.HilbertCrouzeix

# Gate D: the solution restates the challenge's definitions in Definitions.lean.
COPIED_INTO=OAI/Analysis/HilbertCrouzeix/Definitions.lean
COPIED_DEFS="Coeff CoeffSpace numericalRange numericalClosure Amplification tensorOp
  matrixPolynomial polynomialEval normSup contourIntegral contourIndex
  IsCauchyContour chosenContour dunfordIntegral holomorphicCalculus matrixUnit
  holomorphicEval RationalMatrix poleFreeSet rationalFunction rationalCalculus
  rationalEval ZeroConclusion"

# Gate E: weaken "spectrum ⊆ closure of the numerical range" to "⊆ the
# numerical range" in the first theorem and require the dump to notice.
NEG_KIND=dump
NEG_SED='s/spectrum ℂ A ⊆ numericalClosure A := by/spectrum ℂ A ⊆ numericalRange A := by/'
