FAMILY_UPSTREAM_SHA=fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb

FAMILY_DIR=OAI/Computability/Logspace
CHALLENGE=ComparatorChallenges/LogspaceEquality.lean
MAIN_IMPORT=OAI.Computability.Logspace.Equality

