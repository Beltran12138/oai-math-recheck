# openai/math result family 325, second comparator statement:
# ComparatorChallenges/CrouzeixHilbert.lean -- "complete sharp Crouzeix theorem
# on arbitrary Hilbert spaces".  Same family as ../325, different proof
# directory, different statement.  Sourced by ../../recheck.sh and ../../audit.sh.

FAMILY_DIR=OAI/Analysis/Crouzeix
CHALLENGE=ComparatorChallenges/CrouzeixHilbert.lean
MAIN_IMPORT=OAI.Analysis.Crouzeix.Main
DOCS_NUMBER=325

THEOREMS="OAI.CrouzeixHilbert.hilbert"

# Gate C, comparator's method: the statement contains two `structure`s
# (SmoothContour, CalculusContour), and a re-declared structure is a new type,
# so ../325's copy-and-defeq check cannot work here.  tools/StatementDump.lean
# elaborates challenge and solution separately and compares the results.
CHALLENGE_MODULE=ComparatorChallenges.CrouzeixHilbert

# The amplified space is the completion of H ⊗[ℂ] ℂᵐ.  The complete Crouzeix
# inequality needs the Hilbert tensor norm there, not the projective one, and
# that is decided by which instance the definition elaborated with.
DUMP_ASSERT="OAI.CrouzeixHilbert.Amplification|TensorProduct.instNormedAddCommGroup"

# Gate D, a second and cruder check of the same thing: OpenAI's solution
# re-states the challenge's definitions in Definitions.lean; diff them as text.
COPIED_INTO=OAI/Analysis/Crouzeix/Definitions.lean
COPIED_DEFS="Operator Coeff numericalRange numericalClosure supNorm Amplification
  tensorOperator matrixPolynomial polynomialEval SmoothContour SmoothContour.index
  CalculusContour contourEval holomorphicEval matrixHolomorphicEval
  EntrywiseHolomorphic RationalMatrix PolesOutside matrixRationalFunction
  rationalEval matrixRationalEval NonzeroConclusion ZeroConclusion SharpConstant"

# Gate E: weaken the constant in the rational-function bound -- the part of the
# statement that goes beyond polynomials -- and require gate C to notice.
NEG_KIND=dump
NEG_SED='s/^      2 \* supNorm (numericalClosure A) (matrixRationalFunction R) ∧$/      3 * supNorm (numericalClosure A) (matrixRationalFunction R) ∧/'
