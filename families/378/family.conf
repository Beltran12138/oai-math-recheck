# openai/math result family 378 -- "The Exponential Time Hypothesis is False".
# One comparator file, SubexponentialSAT.lean (lean/docs/378.md lists exactly
# one).  Statement gate already done by reading: see PLAN.md / STATEMENT.md.
# Sourced by ../../recheck.sh and ../../audit.sh.

# Added in upstream's 2026-10-26 release; not in fd4aeeb or adc7f12.
FAMILY_UPSTREAM_SHA=7ef5c0cc5ca4b0e072b7a050fca09ab24bc6fa3a

# 3,977 files.  Imports only Mathlib and Lean core (checked 2026-10-27 by
# grepping every import line outside the family's own namespace).
FAMILY_DIR=OAI/Algorithms/SubexponentialSAT
CHALLENGE=ComparatorChallenges/SubexponentialSAT.lean
# SubexponentialSAT.json names OAI.Algorithms.SubexponentialSAT.Main as the
# solution module.
MAIN_IMPORT=OAI.Algorithms.SubexponentialSAT.Main

THEOREMS="OAI.Algorithms.SubexponentialSAT.SqrtLogSpace.exact_count_and_sat"

# Gate C, comparator's method: the statement defines structures, an inductive
# trace and a machine model.
CHALLENGE_MODULE=ComparatorChallenges.SubexponentialSAT

# Gate E: raise the log log factor's power from 2 to 3 in runtimeScale (a
# weaker but still subexponential bound) and require gate C to notice.  Chosen
# to be a change the proof would still satisfy in spirit, so only an exact
# statement comparison can catch it.
NEG_KIND=dump
NEG_SED='s/^  (n : ℝ) \* (Real.log (Real.log ((n : ℝ) + 16))) ^ 2 \/$/  (n : ℝ) * (Real.log (Real.log ((n : ℝ) + 16))) ^ 3 \//'
