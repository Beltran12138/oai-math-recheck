# openai/math result family 325, third comparator statement:
# ComparatorChallenges/CompleteCrouzeix.lean, proved in OAI/Analysis/NumericalRange.
# It states the same inequality as ../325 (DirectCrouzeix) and is proved by a
# separate development, so besides the usual gates, Verify.lean checks that
# this proof closes DirectCrouzeix's statement too.

FAMILY_DIR=OAI/Analysis/NumericalRange
CHALLENGE=ComparatorChallenges/CompleteCrouzeix.lean
MAIN_IMPORT=OAI.Analysis.NumericalRange.Main
DOCS_NUMBER=325

THEOREMS="OAI.CompleteCrouzeix.main"

# Gate C, two independent checks.  The dump compares this challenge with this
# solution, comparator-style.  Verify.lean (built in gate C) is the cross-check
# against DirectCrouzeix's statement.
CHALLENGE_MODULE=ComparatorChallenges.CompleteCrouzeix
AUDIT_TARGETS="Verify"

# Gate D: Verify.lean's definitions must be verbatim DirectCrouzeix's, or the
# cross-check proves CompleteCrouzeix's proof against a statement of our own.
COPIED_FROM=ComparatorChallenges/DirectCrouzeix.lean
COPIED_INTO=Verify.lean
COPIED_DEFS="numericalRange polynomialValue tensorEvaluation rangeMaximum UniversalBound"

# Gate E: weaken the bound in this challenge and require the dump to notice.
NEG_KIND=dump
NEG_SED='s/‖polynomialAt A B‖ ≤ C \* rangeMaximum A B/‖polynomialAt A B‖ ≤ (C + 1) * rangeMaximum A B/'
