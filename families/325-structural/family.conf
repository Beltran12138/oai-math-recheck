# openai/math result family 325, fourth comparator statement:
# ComparatorChallenges/StructuralCrouzeix.lean -- "optimal similarity and
# boundary representation".  The proof directory is small (12 files) because
# most of the machinery lives in OAI/Analysis/NumericalRange, the development
# behind ../325-complete, so that directory is declared as an extra.

FAMILY_DIR=OAI/Analysis/StructuralCrouzeix
EXTRA_DIRS=OAI/Analysis/NumericalRange
CHALLENGE=ComparatorChallenges/StructuralCrouzeix.lean
MAIN_IMPORT=OAI.Analysis.StructuralCrouzeix.Endpoint
DOCS_NUMBER=325

THEOREMS="OAI.StructuralCrouzeixReference.challenge"

# Gate C: the statement contains structures (DiskCoordinate,
# ExteriorCoordinate, IsAdmissible), so only the comparator-style dump works.
CHALLENGE_MODULE=ComparatorChallenges.StructuralCrouzeix

# Gate D: the StructuralCrouzeix-namespace definitions, as text, against the
# solution's Model.lean.  The CompleteCrouzeix-namespace ones the statement
# also uses are spread over NumericalRange/ and covered by the dump only.
COPIED_INTO=OAI/Analysis/StructuralCrouzeix/Model.lean
COPIED_DEFS="RegularAnalyticBoundaryAt IsAdmissible IsMinimizing StrictlyFeasible
  analyticSupNorm boundaryPoint FullEndpoint"

# Gate E: loosen the condition-number bound κ ≤ 2 and require the dump to notice.
NEG_KIND=dump
NEG_SED='s/∃ κ : ℝ, 1 ≤ κ ∧ κ ≤ 2 ∧/∃ κ : ℝ, 1 ≤ κ ∧ κ ≤ 3 ∧/'
