# openai/math result family 107 -- "Matrix multiplication with exponent at most
# 9/4".  Two comparator files; lean/docs/107.md maps them.  This configuration
# checks the complex one, MatrixMultiplication.lean (ω(ℂ) ≤ 9/4, α > 0.465,
# ω(ℂ; 1, 0.709, 1) < 2.092).  MatrixFields.lean (every field) is not checked.
# Sourced by ../../recheck.sh and ../../audit.sh.

FAMILY_DIR=OAI/LinearAlgebra/MatrixMultiplication
CHALLENGE=ComparatorChallenges/MatrixMultiplication.lean
MAIN_IMPORT=OAI.LinearAlgebra.MatrixMultiplication.Main

THEOREMS="OAI.MatrixMultiplication.complex_omega_le_nine_quarters OAI.MatrixMultiplication.complex_alpha_gt_93_div_200 OAI.MatrixMultiplication.complex_rectangular_omega_lt_523_div_250"

# The first family here that is not Mathlib-only.  The 9/4 proof path
# (AuxiliarySeparation/Convex/FixedPoint.lean) imports Brouwer's fixed point
# theorem from harfe/fixed-point-theorems-lean4.  Declared rather than worked
# around; pinned to the rev upstream's manifest pins; gate B follows its axioms.
EXTRA_REQUIRES="fixed-point-theorems:FixedPointTheorems"

CHALLENGE_MODULE=ComparatorChallenges.MatrixMultiplication

# Gate E: claim ω(ℂ) ≤ 8/4 = 2 instead of 9/4 and require gate C to notice.
NEG_KIND=dump
NEG_SED='s/^    Arithmetic.omega ℂ ≤ (9 : ℝ) \/ 4 := by$/    Arithmetic.omega ℂ ≤ (8 : ℝ) \/ 4 := by/'
