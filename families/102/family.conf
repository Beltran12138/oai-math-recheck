# openai/math result family 102 -- "The Unique Games Conjecture and optimal
# approximation thresholds".  Five comparator files; lean/docs/102.md maps them.
# This configuration checks the headline one, UniqueGamesTheorem.lean.
# Sourced by ../../recheck.sh and ../../audit.sh.

FAMILY_DIR=OAI/Computability/UniqueGames
CHALLENGE=ComparatorChallenges/UniqueGamesTheorem.lean
MAIN_IMPORT=OAI.Computability.UniqueGames.Main

THEOREMS="OAI.UniqueGamesTheorem.theorem11"

# Gate C, comparator's method: the statement is built from structures
# (BinaryGapReduction, PermutationTable, ...), so copy-and-defeq cannot work.
CHALLENGE_MODULE=ComparatorChallenges.UniqueGamesTheorem

# What makes this NP-hardness rather than a vacuous statement is that the
# reduction is a polynomial-time Turing machine.  Pin that the structure's
# constructor really takes Mathlib's TM2ComputableInPolyTime, and the
# finite-alphabet side condition Mathlib's FinTM2 does not impose on its own
# (FinTM2 only requires the input stack's alphabet to be finite).
DUMP_ASSERT="OAI.UniqueGamesTheorem.Explicit.MachineOutputContract.BinaryGapReduction.mk|Turing.TM2ComputableInPolyTime
OAI.UniqueGamesTheorem.Explicit.MachineOutputContract.BinaryGapReduction.mk|OAI.UniqueGamesTheorem.Foundations.Complexity.MachineFiniteAlphabet.FiniteAlphabet"

# Gate E: loosen completeness from 1 - ε to 1 - ε/2 and require gate C to notice.
NEG_KIND=dump
NEG_SED='s/^    ∃ labeling, 1 - ε ≤$/    ∃ labeling, 1 - ε \/ 2 ≤/'
